
name: Build Karaoke Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KaraokeProAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: |
          mkdir project
          unzip -q KaraokeProAndroid_Project.zip -d project

      - name: Perbaiki target Java dan Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle")
          s = p.read_text()
          addition = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          s = s.replace("android {", "android {\n" + addition, 1)
          p.write_text(s)
          PY

      - name: Bangun APK
        run: gradle -p project assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Pro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
